# Arch gets its transparency from Hyprland's decoration opacity instead.

# Make a full-screen TUI translucent. background_opacity alone cannot do this:
# it applies only to the DEFAULT background, and an app like slk paints an
# explicit colour into every cell, which kitty then draws opaque. This option
# is the way out — any cell whose background matches one of these colours is
# rendered at the given opacity instead.
#
# The list is slk's Catppuccin Frappé palette: message pane, surfaces, sidebar
# and workspace rail. They share one opacity so the layering between panels
# still reads (each starts from a different base colour). Lower the numbers for
# more show-through; raise them if text over the wallpaper gets hard to read.
#
# Caveat: this matches on colour, not on application — anything else painting
# these exact Frappé colours goes translucent too.
transparent_background_colors #303446@0 #414559@0 #292C3C@0 #1E212C@0 #14161D@0

# Blur whatever shows through. Only has an effect while background_opacity is
# below 1 (0.85 above); on macOS the value is the blur radius.
background_blur 32

# How much of the background colour sits over the blurred desktop. Lower shows
# more of the wallpaper; raise it if text gets hard to read.
background_opacity 0.175
