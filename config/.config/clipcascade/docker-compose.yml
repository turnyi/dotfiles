name: clipcascade

services:
  clipcascade:
    image: sathvikrao/clipcascade:0.7.0
    container_name: clipcascade
    restart: always
    # Loopback only: the tailnet reaches it through `tailscale serve`, which adds TLS.
    ports:
      - "127.0.0.1:8686:8080"
    volumes:
      - database:/database
    environment:
      - CC_MAX_MESSAGE_SIZE_IN_MiB=100
      - CC_SIGNUP_ENABLED=false
      # Behind tailscale serve: build redirects from X-Forwarded-Proto so they are https, not http.
      - SERVER_FORWARD_HEADERS_STRATEGY=framework

volumes:
  database:
